name: Disperse
description: 'Disperse was a London-based construction technology company, backed by Northzone,
  that used computer vision and machine learning to turn 360-degree jobsite imagery into
  automated construction progress tracking and productivity analytics for general contractors.
  Disperse was acquired by OpenSpace in 2023 and its product line and team were folded into
  the OpenSpace Visual Intelligence Platform; the disperse.io domain now redirects to
  openspace.ai. OpenSpace, powered by Spatial AI, turns smartphone, 360-degree camera, and
  drone capture into real-time jobsite intelligence connecting the field and the office
  across documentation, coordination, progress tracking, BIM, and construction risk
  management. This API Evangelist profile tracks the combined OpenSpace surface as the live
  operating home of the Disperse lead.'
